name: SG Garments CI – Backend Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Syntax & Express App Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Check syntax – all backend JS files
        run: |
          node -c api/index.js
          node -c server.js
          node -c db.js
          node -c cloudinary.js
          node -c controllers/*.js
          node -c routes/*.js
          node -c models/*.js
          echo "✅ All backend files passed syntax check."
        working-directory: backend

      - name: Verify Express app exports a valid handler function
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          node -e "
            const path = require('path');
            process.env.MONGODB_URI = '';
            const app = require(path.join(process.env.WORKSPACE, 'backend/api/index.js'));
            if (typeof app !== 'function') {
              console.error('\u274c backend/api/index.js must export a function (Express app)');
              process.exit(1);
            }
            const stack = app._router && app._router.stack;
            if (stack) {
              stack.forEach((layer, i) => {
                if (!layer.handle || typeof layer.handle !== 'function') {
                  console.error('\u274c Undefined middleware at stack index', i, layer);
                  process.exit(1);
                }
              });
            }
            console.log('\u2705 Express app loaded and all middleware handlers are valid functions.');
          "


      - name: Validate vercel.json configuration
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.env.WORKSPACE, 'vercel.json');
            const vConfig = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!vConfig.rewrites || !Array.isArray(vConfig.rewrites)) {
              console.error('\u274c vercel.json missing rewrites configuration');
              process.exit(1);
            }
            console.log('\u2705 Root vercel.json configuration is valid.');
          "
